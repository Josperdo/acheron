services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    # Optional: if .env exists, INGESTION_MODE and the AZURE_* values flow in
    # from it. Without one, the backend defaults to fixture mode.
    env_file:
      - path: .env
        required: false

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
